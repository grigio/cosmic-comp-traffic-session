name: CI

# Cheap sanity checks on every push / pull request: the shell scripts pass
# shellcheck and the PKGBUILD still builds. Releases are built by
# arch-package.yml on v* tags.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck -s sh files/usr/bin/cosmalia-session
          shellcheck -s bash scripts/*.sh cosmalia-session.install

  package:
    name: makepkg
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Bootstrap git
        run: pacman -Syu --noconfirm --needed --disable-download-timeout git

      - uses: actions/checkout@v6

      - name: Build
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder 2>/dev/null || true
          mkdir -p /tmp/pkgout
          chown -R builder:builder "$GITHUB_WORKSPACE" /tmp/pkgout
          # cosmic-comp-traffic is not in the official repos and provides
          # cosmic-comp: skip the dep check instead of pulling the stock
          # compositor into the clean container.
          su builder -s /bin/bash -c "
            cd '$GITHUB_WORKSPACE'
            PKGDEST=/tmp/pkgout makepkg --nodeps --noconfirm --force
          "
          ls -l /tmp/pkgout
          # the launcher must be executable inside the package
          bsdtar -tvf /tmp/pkgout/*.pkg.tar.zst | tee /tmp/pkglist.txt
          grep -qE '^-rwxr-xr-x .*usr/bin/cosmalia-session$' /tmp/pkglist.txt
          grep -qE '^-rw-r--r-- .*usr/share/wayland-sessions/cosmalia\.desktop$' /tmp/pkglist.txt
          grep -qE '^-rw-r--r-- .*usr/lib/systemd/user/cosmalia-session\.target$' /tmp/pkglist.txt
          grep -qE '^-rwxr-xr-x .*usr/bin/cosmalia-session-default$' /tmp/pkglist.txt
